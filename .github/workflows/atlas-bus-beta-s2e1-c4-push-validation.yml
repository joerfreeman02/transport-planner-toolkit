name: ATLAS Bus Beta S2E-1 C4 final product trace

on:
  push:
    branches:
      - codex/atlas-bus-beta-s2e-1-c4-final-product-trace
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: atlas-bus-beta-s2e1-c4-final-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-candidate-diagnosis:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.repository == 'joerfreeman02/transport-planner-toolkit' && github.ref == 'refs/heads/codex/atlas-bus-beta-s2e-1-c4-final-product-trace'
    uses: ./.github/workflows/atlas-bus-beta-s2e1-diagnosis.yml
    with:
      mode: normal_runtime_diagnosis
    permissions:
      actions: read
      contents: read
