name: ATLAS Bus Beta S2E-1 frozen-candidate diagnosis

on:
  workflow_call:
    inputs:
      mode:
        description: Run a diagnostic against the exact frozen Run #75 candidate using production adapter composition.
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  frozen-candidate-diagnosis:
    if: (github.ref == 'refs/heads/codex/atlas-bus-beta-s2e-1-intelligence-restoration' || github.ref == 'refs/heads/codex/atlas-bus-beta-s2e-1-c1-manual-corrections' || github.ref == 'refs/heads/codex/atlas-bus-beta-s2e-1-c3-final-intelligence-correction' || github.ref == 'refs/heads/codex/atlas-bus-beta-s2e-1-c4-final-product-trace' || github.ref == 'refs/heads/codex/atlas-bus-beta-final-closeout') && inputs.mode == 'normal_runtime_diagnosis'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: pnpm
      - name: Install deterministic test dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for the C4 browser contract suite
        if: github.ref == 'refs/heads/codex/atlas-bus-beta-s2e-1-c4-final-product-trace'
        run: pnpm exec playwright install chromium
      - name: Install Chromium and OS dependencies for other browser contract suites
        if: github.ref != 'refs/heads/codex/atlas-bus-beta-s2e-1-c4-final-product-trace'
        run: pnpm exec playwright install --with-deps chromium
      - name: Ensure the default-branch ref is available to repository contract tests
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Verify deterministic empty TfL diagnostic boundary
        run: node tests/atlas/s2e1-deterministic-empty-tfl.test.mjs
      - name: Run full Bus-data Python suite
        run: python -m unittest discover -s tools/atlas-bus-data -p 'test_*.py' -v
      - name: Run full deterministic ATLAS suite
        run: |
          set -o pipefail
          node tests/atlas/run-all.mjs | tee "$RUNNER_TEMP/atlas-s2e1-node-suite.log"
          grep -Fx 'ATLAS Alpha.15 deterministic suite passed.' "$RUNNER_TEMP/atlas-s2e1-node-suite.log"
      - name: Verify immutable Run #75 artifact identity and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPOSITORY/actions/artifacts/12275615359" > "$RUNNER_TEMP/run75-artifact.json"
          python - "$RUNNER_TEMP/run75-artifact.json" <<'PY'
          import json, sys
          from pathlib import Path
          artifact = json.loads(Path(sys.argv[1]).read_text())
          expected = {
              'id': 12275615359,
              'name': 'atlas-bus-beta-review-candidate-39430415441',
              'digest': 'sha256:5cad24e0a47a4c77a8ec8616d746bf9f538404420fcb9505f297607632e1a471',
              'expired': False,
              'workflow_run': {'id': 39430415441, 'head_sha': '151199cc914c235870f444d26b03c2309edbd035'},
          }
          for key, value in expected.items():
              actual = artifact.get(key)
              if isinstance(value, dict):
                  for nested, nested_value in value.items():
                      if (actual or {}).get(nested) != nested_value:
                          raise SystemExit(f'Run #75 artifact {key}.{nested} mismatch')
              elif actual != value:
                  raise SystemExit(f'Run #75 artifact {key} mismatch')
          print('Exact immutable Run #75 candidate artifact, digest and producer verified.')
          PY
      - name: Restore only the immutable Run #75 candidate
        uses: actions/download-artifact@v8
        with:
          name: atlas-bus-beta-review-candidate-39430415441
          run-id: 39430415441
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: restored
      - name: Verify retained checkpoint provenance
        run: node tools/atlas-data-publication/review-candidate-checkpoint.mjs verify --candidate-root restored/candidate-site --checkpoint-root restored/review-checkpoint --expected-run-id 39430415441 --expected-commit-sha 151199cc914c235870f444d26b03c2309edbd035
      - name: Run actual-candidate planner diagnostic
        if: always() && hashFiles('restored/candidate-site/atlas/data/bus/manifest.json') != ''
        run: |
          mkdir -p candidate-diagnostic
          failed=0
          for control in waltham pipers pipers46 pe1 enfield queensgate; do
            if ! node tests/atlas/s2e1-normal-runtime-candidate-diagnostic.mjs restored/candidate-site "candidate-diagnostic/${control}.json" "$control"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Run actual-candidate browser and Word audit
        if: always() && hashFiles('restored/candidate-site/atlas/data/bus/manifest.json') != ''
        run: node tests/atlas/s2c3-real-candidate-runtime-audit.mjs restored/candidate-site candidate-diagnostic/real-candidate-browser-word-audit.json
      - name: Run rendered normal-product browser and generated Word acceptance audit
        if: always() && hashFiles('restored/candidate-site/atlas/data/bus/manifest.json') != ''
        run: node tests/atlas/s2e1-manual-product-audit.mjs restored/candidate-site candidate-diagnostic/manual-product-acceptance.json
      - name: Run fixture-backed Chingford TfL route 657 golden regression
        if: always()
        run: node tests/atlas/tfl-bus-timetable.test.mjs
      - name: Upload normal-runtime candidate control-matrix report
        if: always() && hashFiles('candidate-diagnostic/*.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: atlas-bus-beta-s2e1-normal-runtime-diagnostic-${{ github.run_id }}
          path: candidate-diagnostic/**/*
          if-no-files-found: error
          retention-days: 90
