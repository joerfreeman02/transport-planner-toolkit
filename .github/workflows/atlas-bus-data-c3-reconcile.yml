name: ATLAS C3 verify checkpoints and reconcile

on:
  workflow_call:
    inputs:
      checkpoint_run_id:
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify checkpoint producer run and both named artifacts before download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
          CHECKPOINT_RUN_ID: ${{ inputs.checkpoint_run_id }}
          EXPECTED_BRANCH: codex/atlas-bus-data-trust-1a-c1b-c3-recoverable-reconciliation
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          base = os.environ['GH_API_URL'].rstrip('/')
          repo = urllib.parse.quote(os.environ['GH_REPOSITORY'], safe='/')
          run_id = os.environ['CHECKPOINT_RUN_ID']
          headers = {'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'X-GitHub-Api-Version': '2022-11-28'}
          def get(path):
              request = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response: return json.loads(response.read())
          run = get(f'/repos/{repo}/actions/runs/{run_id}')
          if (run.get('repository', {}).get('full_name') != os.environ['GH_REPOSITORY']
                  or run.get('head_branch') != os.environ['EXPECTED_BRANCH']
                  or run.get('head_sha') != os.environ['EXPECTED_SHA']
                  or run.get('event') != 'workflow_dispatch'
                  or '.github/workflows/atlas-bus-data-refresh.yml' not in run.get('path', '')):
              raise SystemExit('Checkpoint producer repository, workflow, event, branch, or compatible commit mismatch.')
          artifacts = get(f'/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100').get('artifacts', [])
          required = {f'atlas-primary-reconciliation-checkpoint-{run_id}', f'atlas-tnds-reconciliation-checkpoint-{run_id}'}
          available = {item.get('name') for item in artifacts if item.get('expired') is False and str(item.get('workflow_run', {}).get('id')) == run_id}
          if not required <= available: raise SystemExit('Required verified reconciliation checkpoint artifact is absent or expired.')
          print('Checkpoint producer and exact artifacts verified before restore.')
          PY
      - name: Restore primary checkpoint from verified producer
        uses: actions/download-artifact@v4
        with:
          name: atlas-primary-reconciliation-checkpoint-${{ inputs.checkpoint_run_id }}
          run-id: ${{ inputs.checkpoint_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/primary-checkpoint
      - name: Restore TNDS checkpoint from verified producer
        uses: actions/download-artifact@v4
        with:
          name: atlas-tnds-reconciliation-checkpoint-${{ inputs.checkpoint_run_id }}
          run-id: ${{ inputs.checkpoint_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tnds-checkpoint
      - name: Validate immutable source and checkpoint provenance, then reconcile
        env:
          CHECKPOINT_RUN_ID: ${{ inputs.checkpoint_run_id }}
          CHECKPOINT_BRANCH: ${{ github.ref }}
          CHECKPOINT_COMMIT: ${{ github.sha }}
          CHECKPOINT_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/c3-reconciliation-evidence"
          cat > "$RUNNER_TEMP/primary-expected.json" <<'JSON'
          {"side":"PRIMARY","sourceSnapshotId":"13e2895be61c5bb5adaf8adec9896520b8224ff243766818d3ca920f0eae71e1","sourceProducerRunId":"38533475680","repository":"${{ github.repository }}","preparationCodeCommit":"${{ github.sha }}","checkpointProducerRunId":"${{ inputs.checkpoint_run_id }}","checkpointBranch":"${{ github.ref }}","preparedSchema":"atlas-prepared-bus-data-v2"}
          JSON
          cat > "$RUNNER_TEMP/tnds-expected.json" <<'JSON'
          {"side":"TNDS","sourceProducerRunId":"38579244547","sourceArtifactName":"atlas-tnds-quarantined-38579244547","repository":"${{ github.repository }}","preparationCodeCommit":"${{ github.sha }}","checkpointProducerRunId":"${{ inputs.checkpoint_run_id }}","checkpointBranch":"${{ github.ref }}","preparedSchema":"atlas-prepared-bus-tnds-v1"}
          JSON
          PYTHONPATH=tools/atlas-bus-data python tools/atlas-bus-data/run_reconciliation.py \
            --primary-checkpoint "$RUNNER_TEMP/primary-checkpoint/checkpoint.json.gz" \
            --tnds-checkpoint "$RUNNER_TEMP/tnds-checkpoint/checkpoint.json.gz" \
            --primary-expected "$RUNNER_TEMP/primary-expected.json" \
            --tnds-expected "$RUNNER_TEMP/tnds-expected.json" \
            --output "$RUNNER_TEMP/c3-reconciliation-evidence" \
            --producer-run-id "$CHECKPOINT_RUN_ID" --branch "$CHECKPOINT_BRANCH" \
            --commit "$CHECKPOINT_COMMIT" --repository "$CHECKPOINT_REPOSITORY"
      - name: Upload bounded C3 trust evidence and full compressed ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-bus-reconciliation-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/c3-reconciliation-evidence
          if-no-files-found: error
          retention-days: 90
