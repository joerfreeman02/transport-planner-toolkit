name: ATLAS Bus data refresh

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Bypass the weekly freshness guard and run the complete validated refresh.'
        required: false
        default: false
        type: boolean
      measure_only:
        description: 'Acquire and measure a fresh candidate without publication or deployment.'
        required: false
        default: false
        type: boolean
      resume_checkpoint_run_id:
        description: 'Explicitly resume a prior verified candidate checkpoint by producer workflow run ID.'
        required: false
        default: ''
        type: string
      prepared_schema:
        description: 'Prepared-data schema. v2 is diagnostic-only and cannot publish.'
        required: false
        default: v1
        type: choice
        options:
          - v1
          - v2
      v2_source_snapshot_run_id:
        description: Exact prior source workflow run ID for frozen diagnostic reuse.
        required: false
        default: ''
        type: string
      v2_expected_snapshot_id:
        description: Optional exact snapshot ID to require for explicit frozen reuse; leave blank for fresh acquisition.
        required: false
        default: ''
        type: string
      v2_expected_source_count:
        description: Optional exact source count to require for explicit frozen reuse; leave blank for fresh acquisition.
        required: false
        default: ''
        type: string
      v2_expected_total_bytes:
        description: Optional exact total bytes to require for explicit frozen reuse; leave blank for fresh acquisition.
        required: false
        default: ''
        type: string
      review_candidate_mode:
        description: 'C1 only: disabled for offline preflight, compose a fresh review candidate, or explicitly restore one.'
        required: false
        default: disabled
        type: choice
        options:
          - disabled
          - compose
          - restore_candidate
      primary_source_run_id:
        description: Exact primary snapshot producer run to restore; blank acquires fresh sources in compose mode.
        required: false
        default: ''
        type: string
      primary_artifact_id:
        description: Exact primary source artifact ID for restore.
        required: false
        default: ''
        type: string
      primary_artifact_digest:
        description: Exact primary source artifact digest for restore.
        required: false
        default: ''
        type: string
      tnds_source_run_id:
        description: Exact raw TNDS producer run to restore; blank acquires fresh TNDS in compose mode.
        required: false
        default: ''
        type: string
      tnds_artifact_id:
        description: Exact raw TNDS artifact ID for restore.
        required: false
        default: ''
        type: string
      tnds_artifact_digest:
        description: Exact raw TNDS artifact digest for restore.
        required: false
        default: ''
        type: string
      candidate_checkpoint_run_id:
        description: Exact review candidate producer run to restore in restore_candidate mode.
        required: false
        default: ''
        type: string
      candidate_artifact_id:
        description: Exact full review candidate artifact ID for restore.
        required: false
        default: ''
        type: string
      candidate_artifact_digest:
        description: Exact full review candidate artifact digest for restore.
        required: false
        default: ''
        type: string
  schedule:
    - cron: '37 5 * * 1'

permissions:
  actions: read
  contents: read

env:
  ATLAS_BUS_DATA_REPOSITORY: ${{ vars.ATLAS_BUS_DATA_REPOSITORY }}
  ATLAS_BUS_DATA_SITE_URL: ${{ vars.ATLAS_BUS_DATA_SITE_URL }}
  ATLAS_TNDS_BANKS_JSON: ${{ vars.ATLAS_TNDS_BANKS_JSON }}
  ATLAS_REFERENCE_DATA_BRANCH: ${{ vars.ATLAS_REFERENCE_DATA_BRANCH || 'pages-publish' }}

concurrency:
  group: atlas-bus-pages
  cancel-in-progress: false

jobs:
  main-guard:
    name: Check refresh execution context
    runs-on: ubuntu-latest
    outputs:
      trust_mode: ${{ steps.s2a-c1-selector.outputs.trust_mode || steps.trust-selector.outputs.trust_mode }}
      trust_prior_producer_run_id: ${{ steps.s2a-c1-selector.outputs.prior_producer_run_id || steps.trust-selector.outputs.prior_producer_run_id }}
      review_candidate_mode: ${{ steps.s2a-c1-selector.outputs.review_candidate_mode }}
    steps:
      - name: Refuse non-manual non-main execution
        if: github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch'
        run: |
          echo "::error::Only refs/heads/main or a manually dispatched diagnostic may run this workflow; refusing $GITHUB_REF."
          exit 1
      - name: Refuse checkpoint resume outside trusted production context
        if: inputs.resume_checkpoint_run_id != '' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c1-browser-dispatch-entry' && github.ref != 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c2-preparation-scale-closeout' && github.ref != 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-recoverable-reconciliation' && github.ref != 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-c1-region-scale-recovery-closeout' && github.ref != 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-c1-c1-c1-branch-dispatch-closeout' && github.ref != 'refs/heads/codex/atlas-bus-data-trust-r45-c1-reconciliation-contract-closeout'
        run: |
          echo '::error::Cross-run checkpoint resume is allowed only from refs/heads/main.'
          exit 1
      - name: Refuse v2 outside diagnostic-only execution
        if: inputs.prepared_schema == 'v2' && github.ref == 'refs/heads/main' && inputs.measure_only != true
        run: |
          echo '::error::Prepared-data v2 is diagnostic-only; measure_only=true is required on main and publication is disabled.'
          exit 1
      - name: Refuse malformed TNDS TRUST selector
        if: startsWith(inputs.v2_expected_snapshot_id, 'TNDS-TRUST-') && inputs.v2_expected_snapshot_id != 'TNDS-TRUST-DIAGNOSTIC-C1A' && inputs.v2_expected_snapshot_id != 'TNDS-TRUST-PREFLIGHT-C1B'
        run: |
          echo '::error::Unrecognized TNDS TRUST selector; refusing before source acquisition.'
          exit 1
      - name: Refuse invalid TNDS TRUST diagnostic selection
        if: inputs.v2_expected_snapshot_id == 'TNDS-TRUST-DIAGNOSTIC-C1A' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || inputs.prepared_schema != 'v2' || inputs.measure_only != true || inputs.force_refresh != true || inputs.resume_checkpoint_run_id != '' || inputs.v2_expected_source_count != '' || inputs.v2_expected_total_bytes != '')
        run: |
          echo '::error::TNDS TRUST live selection requires manual non-main v2 measure-only forced diagnostic mode with unrelated snapshot inputs blank.'
          exit 1
      - name: Refuse invalid TNDS TRUST offline preflight selection
        if: inputs.v2_expected_snapshot_id == 'TNDS-TRUST-PREFLIGHT-C1B' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || inputs.prepared_schema != 'v2' || inputs.measure_only != true || inputs.force_refresh != true || inputs.resume_checkpoint_run_id != '' || inputs.v2_source_snapshot_run_id != '' || inputs.v2_expected_source_count != '' || inputs.v2_expected_total_bytes != '')
        run: |
          echo '::error::TNDS TRUST offline preflight requires manual non-main v2 measure-only forced mode and all unrelated snapshot inputs blank.'
          exit 1
      - name: Refuse expected snapshot without an explicit frozen producer run
        if: inputs.v2_expected_snapshot_id != '' && !startsWith(inputs.v2_expected_snapshot_id, 'TNDS-TRUST-') && inputs.v2_source_snapshot_run_id == ''
        run: |
          echo '::error::A normal expected snapshot ID is valid only with an explicit frozen source producer run ID.'
          exit 1
      - name: Resolve S2A-C1 offline preflight selector
        id: s2a-c1-selector
        if: github.ref == 'refs/heads/codex/atlas-bus-beta-s2a-c1-review-candidate-composition'
        env:
          S2A_C1_BRANCH: refs/heads/codex/atlas-bus-beta-s2a-c1-review-candidate-composition
          PREPARED_SCHEMA: ${{ inputs.prepared_schema }}
          MEASURE_ONLY: ${{ inputs.measure_only }}
          FORCE_REFRESH: ${{ inputs.force_refresh }}
          RESUME_RUN_ID: ${{ inputs.resume_checkpoint_run_id }}
          EXPECTED_SNAPSHOT_ID: ${{ inputs.v2_expected_snapshot_id }}
          SOURCE_RUN_ID: ${{ inputs.v2_source_snapshot_run_id }}
          EXPECTED_SOURCE_COUNT: ${{ inputs.v2_expected_source_count }}
          EXPECTED_TOTAL_BYTES: ${{ inputs.v2_expected_total_bytes }}
          CANDIDATE_MODE: ${{ inputs.review_candidate_mode }}
          PRIMARY_RUN: ${{ inputs.primary_source_run_id }}
          PRIMARY_ID: ${{ inputs.primary_artifact_id }}
          PRIMARY_DIGEST: ${{ inputs.primary_artifact_digest }}
          TNDS_RUN: ${{ inputs.tnds_source_run_id }}
          TNDS_ID: ${{ inputs.tnds_artifact_id }}
          TNDS_DIGEST: ${{ inputs.tnds_artifact_digest }}
          CANDIDATE_RUN: ${{ inputs.candidate_checkpoint_run_id }}
          CANDIDATE_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_DIGEST: ${{ inputs.candidate_artifact_digest }}
          SCHEMA: ${{ inputs.prepared_schema }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != 'workflow_dispatch' ]]; then
            echo '::error::The S2A-C1 selector accepts only manual dispatches.'
            exit 1
          fi
          if [[ "$CANDIDATE_MODE" == 'disabled' ]]; then
            if [[ "$PREPARED_SCHEMA" != 'v2' || "$MEASURE_ONLY" != 'true' || "$FORCE_REFRESH" != 'true' || -n "$RESUME_RUN_ID" || "$EXPECTED_SNAPSHOT_ID" != 'TNDS-TRUST-PREFLIGHT-C1B' || -n "$SOURCE_RUN_ID" || -n "$EXPECTED_SOURCE_COUNT" || -n "$EXPECTED_TOTAL_BYTES" || -n "$PRIMARY_RUN$PRIMARY_ID$PRIMARY_DIGEST$TNDS_RUN$TNDS_ID$TNDS_DIGEST$CANDIDATE_RUN$CANDIDATE_ID$CANDIDATE_DIGEST" ]]; then
              echo '::error::The S2A-C1 branch accepts only the exact offline-preflight selector or the isolated review-candidate selector.'
              exit 1
            fi
            echo 'trust_mode=offline_preflight' >> "$GITHUB_OUTPUT"
            echo 'prior_producer_run_id=' >> "$GITHUB_OUTPUT"
            echo 'review_candidate_mode=' >> "$GITHUB_OUTPUT"
          elif [[ "$CANDIDATE_MODE" == 'compose' || "$CANDIDATE_MODE" == 'restore_candidate' ]]; then
            if [[ "$SCHEMA" != 'v1' || "$MEASURE_ONLY" != 'false' || "$FORCE_REFRESH" != 'false' || -n "$RESUME_RUN_ID$EXPECTED_SNAPSHOT_ID$SOURCE_RUN_ID$EXPECTED_SOURCE_COUNT$EXPECTED_TOTAL_BYTES" ]]; then
              echo '::error::Review-candidate mode requires all legacy refresh and TRUST selector inputs to remain at their disabled defaults.'
              exit 1
            fi
            echo 'trust_mode=review_candidate' >> "$GITHUB_OUTPUT"
            echo 'prior_producer_run_id=' >> "$GITHUB_OUTPUT"
            echo "review_candidate_mode=$CANDIDATE_MODE" >> "$GITHUB_OUTPUT"
          else
            echo '::error::Unknown S2A-C1 review-candidate mode.'
            exit 1
          fi

      - name: Resolve exact-branch TRUST browser selector
        id: trust-selector
        if: github.ref != 'refs/heads/codex/atlas-bus-beta-s2a-c1-review-candidate-composition'
        env:
          TRUST_BRANCH_C3: refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-recoverable-reconciliation
          TRUST_BRANCH_C3_C1: refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-c1-region-scale-recovery-closeout
          TRUST_BRANCH_C3_C1_C1: refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-c1-c1-c1-branch-dispatch-closeout
          TRUST_BRANCH_R45_C1: refs/heads/codex/atlas-bus-data-trust-r45-c1-reconciliation-contract-closeout
          S2A_BRANCH: refs/heads/codex/atlas-bus-beta-s2a-refresh-checkpoint-readiness
          PREPARED_SCHEMA: ${{ inputs.prepared_schema }}
          MEASURE_ONLY: ${{ inputs.measure_only }}
          FORCE_REFRESH: ${{ inputs.force_refresh }}
          RESUME_RUN_ID: ${{ inputs.resume_checkpoint_run_id }}
        run: |
          if [[ "$GITHUB_REF" == "$S2A_BRANCH" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != 'workflow_dispatch' || "$PREPARED_SCHEMA" != 'v2' || "$MEASURE_ONLY" != 'true' || "$FORCE_REFRESH" != 'true' || -n "$RESUME_RUN_ID" ]]; then
              echo '::error::The S2A branch accepts only the forced, measure-only v2 offline-preflight selection.'
              exit 1
            fi
            echo 'trust_mode=offline_preflight' >> "$GITHUB_OUTPUT"
            echo 'prior_producer_run_id=' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_REF" != "$TRUST_BRANCH_C3" && "$GITHUB_REF" != "$TRUST_BRANCH_C3_C1" && "$GITHUB_REF" != "$TRUST_BRANCH_C3_C1_C1" && "$GITHUB_REF" != "$TRUST_BRANCH_R45_C1" ]]; then
            echo 'trust_mode=' >> "$GITHUB_OUTPUT"
            echo 'prior_producer_run_id=' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" != 'workflow_dispatch' || "$PREPARED_SCHEMA" != 'v2' || "$MEASURE_ONLY" != 'true' ]]; then
            echo '::error::The controlled TRUST branch accepts only workflow_dispatch with prepared_schema=v2 and measure_only=true.'
            exit 1
          fi

          if [[ "$GITHUB_REF" == "$TRUST_BRANCH_R45_C1" ]]; then
            if [[ "$FORCE_REFRESH" != 'true' || "$RESUME_RUN_ID" != '38731043427' ]]; then
              echo '::error::The R45-C1 closeout branch accepts only the Run #45 checkpoint-only retry selector.'
              exit 1
            fi
            echo 'trust_mode=c3_checkpoint_retry' >> "$GITHUB_OUTPUT"
            echo "prior_producer_run_id=$RESUME_RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$FORCE_REFRESH" == 'false' && -z "$RESUME_RUN_ID" ]]; then
            echo 'trust_mode=offline_preflight' >> "$GITHUB_OUTPUT"
            echo 'prior_producer_run_id=' >> "$GITHUB_OUTPUT"
          elif [[ "$FORCE_REFRESH" == 'true' && "$RESUME_RUN_ID" == '38579244547' ]]; then
            echo 'trust_mode=c3_live_trust' >> "$GITHUB_OUTPUT"
            echo "prior_producer_run_id=$RESUME_RUN_ID" >> "$GITHUB_OUTPUT"
          elif [[ "$FORCE_REFRESH" == 'true' && "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo 'trust_mode=c3_checkpoint_retry' >> "$GITHUB_OUTPUT"
            echo "prior_producer_run_id=$RESUME_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo '::error::Invalid C3 selection. First live mode requires Run #40; retry requires a numeric C3 checkpoint producer run.'
            exit 1
          fi
      - name: Record safe execution mode
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'Manual non-main execution is diagnostic-only; publication and deployment steps are disabled.'
          else
            echo 'Main execution may publish only after every Bus slot and TNDS candidate-bank root validates.'
          fi

  freshness:
    name: Check weekly Bus refresh freshness
    needs: main-guard
    if: inputs.prepared_schema != 'v2' && needs.main-guard.outputs.trust_mode == ''
    runs-on: ubuntu-latest
    outputs:
      refresh_required: ${{ steps.decision.outputs.refresh_required }}
      reason: ${{ steps.decision.outputs.reason }}
      message: ${{ steps.decision.outputs.message }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Obtain deployed last-known-good configuration and manifests
        run: node tools/atlas-data-publication/fetch-last-known-good.mjs 'https://joerfreeman02.github.io/transport-planner-toolkit/atlas/' last-known-good
      - name: Decide whether a full refresh is required
        id: decision
        env:
          FORCE_REFRESH: ${{ (github.event_name == 'workflow_dispatch' && (inputs.force_refresh || inputs.resume_checkpoint_run_id != '' || inputs.prepared_schema == 'v2')) || (github.event_name == 'schedule') }}
        run: node tools/atlas-bus-data/refresh-freshness.mjs --status last-known-good/atlas/data/status/manifest.json --bus last-known-good/atlas/data/bus/manifest.json --tnds last-known-good/atlas/data/bus-tnds/manifest.json --force-refresh "$FORCE_REFRESH" --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Record freshness decision
        run: echo "${{ steps.decision.outputs.message }}"

  build-validate:
    name: Build and validate Bus/TNDS candidate
    needs: [main-guard, freshness]
    if: inputs.prepared_schema != 'v2' && needs.main-guard.outputs.trust_mode == '' && needs.freshness.result == 'success' && needs.freshness.outputs.refresh_required == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      ATLAS_DIAGNOSTIC_ONLY: ${{ inputs.measure_only || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') }}
      ATLAS_CHECKPOINT_PRODUCER_RUN_ID: ${{ inputs.resume_checkpoint_run_id || github.run_id }}
      ATLAS_CURRENT_CANDIDATE_CACHE_KEY: atlas-verified-candidate-checkpoint-v2-${{ github.run_id }}
      ATLAS_CANDIDATE_CACHE_KEY: atlas-verified-candidate-checkpoint-v2-${{ inputs.resume_checkpoint_run_id || github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Prepare isolated Pages site
        run: |
          rm -rf pages-site
          mkdir pages-site
          rsync -a --exclude='.git' --exclude='pages-site' --exclude='atlas/data/bus' --exclude='atlas/data/bus-tnds' ./ pages-site/
      - name: Require publication targets only for production
        if: github.ref == 'refs/heads/main' && inputs.measure_only != true
        run: |
          test -n "$ATLAS_BUS_DATA_REPOSITORY"
          test -n "$ATLAS_BUS_DATA_SITE_URL"
          test -n "$ATLAS_TNDS_BANKS_JSON"
          test -n "${{ secrets.ATLAS_REFERENCE_DATA_TOKEN }}"
      - name: Obtain last-known-good deployed metadata
        run: node tools/atlas-data-publication/fetch-last-known-good.mjs 'https://joerfreeman02.github.io/transport-planner-toolkit/atlas/' last-known-good
      - name: Restore exact verified candidate checkpoint
        id: candidate-cache
        if: github.ref == 'refs/heads/main' && inputs.measure_only != true
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            pages-site/atlas/data/bus
            pages-site/atlas/data/bus-tnds
            pages-site/atlas/data/status
            pages-site/atlas/config/atlas-candidate-measurement.json
            pages-site/.atlas-recovery/verified-candidate.json
          key: ${{ env.ATLAS_CANDIDATE_CACHE_KEY }}
      - name: Verify restored candidate checkpoint
        id: checkpoint-restore
        if: github.ref == 'refs/heads/main' && inputs.measure_only != true
        env:
          ATLAS_CACHE_EXACT_HIT: ${{ steps.candidate-cache.outputs.cache-hit }}
          ATLAS_CACHE_MATCHED_KEY: ${{ steps.candidate-cache.outputs.cache-matched-key }}
        run: node tools/atlas-data-publication/candidate-checkpoint.mjs --restore --candidate-site pages-site --requested-producer-run-id "$ATLAS_CHECKPOINT_PRODUCER_RUN_ID" --current-run-id "${{ github.run_id }}" --current-commit-sha "${{ github.sha }}" --workflow-name "${{ github.workflow }}" --current-ref "${{ github.ref }}" --event-name "${{ github.event_name }}" --explicit-resume "${{ inputs.resume_checkpoint_run_id != '' }}" --repository-root "$GITHUB_WORKSPACE" --cache-hit "$ATLAS_CACHE_EXACT_HIT" --cache-matched-key "$ATLAS_CACHE_MATCHED_KEY"
      - name: Record checkpoint resume decision
        if: github.ref == 'refs/heads/main' && inputs.measure_only != true
        run: |
          if [[ "${{ steps.checkpoint-restore.outputs.valid }}" == "true" ]]; then
            echo "Authoritative acquisition SKIPPED; verified candidate checkpoint restored from producer run $ATLAS_CHECKPOINT_PRODUCER_RUN_ID."
          elif [[ "${{ steps.candidate-cache.outputs.cache-hit }}" == "true" ]]; then
            echo 'Authoritative acquisition REQUIRED; the exact cache entry was invalid and remains immutable. The fresh candidate will not claim to replace it under the same key; an explicit cross-run request may save a new current-run key.'
          else
            echo "Authoritative acquisition REQUIRED; checkpoint restore was not accepted: ${{ steps.checkpoint-restore.outputs.reason }}"
          fi
      - name: Prepare candidate workspace for authoritative acquisition
        if: github.ref == 'refs/heads/main' && inputs.measure_only != true && steps.checkpoint-restore.outputs.valid != 'true'
        run: |
          rm -rf pages-site/atlas/data/bus pages-site/atlas/data/bus-tnds pages-site/atlas/data/status pages-site/.atlas-recovery
          rm -f pages-site/atlas/config/atlas-candidate-measurement.json
      - name: Run production publication preflight before acquisition
        if: github.ref == 'refs/heads/main' && inputs.measure_only != true
        env:
          ATLAS_REFERENCE_DATA_TOKEN: ${{ secrets.ATLAS_REFERENCE_DATA_TOKEN }}
        run: node tools/atlas-data-publication/preflight-publication.mjs --config last-known-good/atlas/config/atlas-data-sources.json
      - name: Acquire and build validated Bus/TNDS candidate
        if: github.ref != 'refs/heads/main' || inputs.measure_only == true || steps.checkpoint-restore.outputs.valid != 'true'
        env:
          TNDS_USERNAME: ${{ inputs.prepared_schema != 'v2' && secrets.TNDS_USERNAME || '' }}
          TNDS_PASSWORD: ${{ inputs.prepared_schema != 'v2' && secrets.TNDS_PASSWORD || '' }}
          ATLAS_NODE: node
        run: python tools/atlas-bus-data/refresh_bus_data.py --site-root pages-site --previous-root last-known-good --prepared-schema "${{ inputs.prepared_schema || 'v1' }}" ${{ inputs.prepared_schema == 'v2' && '--bus-only-diagnostic' || '' }}
      - name: Validate fresh or restored candidate data
        id: candidate-validation
        continue-on-error: ${{ inputs.prepared_schema == 'v2' }}
        run: python tools/atlas-bus-data/validate_candidate.py --site-root pages-site ${{ inputs.prepared_schema == 'v2' && '--bus-only' || '' }}
      - name: Run deterministic ATLAS checks
        if: always()
        run: node tests/atlas/run-all.mjs
      - name: Measure candidate publication capacity
        run: node tools/atlas-data-publication/measure-candidate.mjs --candidate-site pages-site --output pages-site/atlas/config/atlas-candidate-measurement.json ${{ inputs.prepared_schema == 'v2' && '--bus-only' || '' }}
      - name: Write diagnostic source-cache manifest
        if: inputs.prepared_schema == 'v2' && (inputs.measure_only == true || github.ref != 'refs/heads/main')
        run: |
          CANDIDATE_FINGERPRINT=$(node --input-type=module -e "import { computeCandidateGenerationCompatibilityFingerprint } from './tools/atlas-data-publication/candidate-compatibility.mjs'; console.log((await computeCandidateGenerationCompatibilityFingerprint({ rootDir: process.cwd() })).sha256)")
          python tools/atlas-bus-data/diagnostic_bus_cache.py --site-root pages-site --repository-sha "${{ github.sha }}" --fingerprint "$CANDIDATE_FINGERPRINT"
      - name: Run aggregate v2 structural scan
        if: always() && inputs.prepared_schema == 'v2' && (inputs.measure_only == true || github.ref != 'refs/heads/main')
        continue-on-error: true
        run: mkdir -p diagnostic-output && python tools/atlas-bus-data/structural_scan.py --site-root pages-site --output diagnostic-output/structural-scan.json
      - name: Probe TNDS metadata without archive transfer
        if: always() && inputs.prepared_schema == 'v2' && (inputs.measure_only == true || github.ref != 'refs/heads/main')
        continue-on-error: true
        env:
          TNDS_USERNAME: ${{ secrets.TNDS_USERNAME }}
          TNDS_PASSWORD: ${{ secrets.TNDS_PASSWORD }}
        run: mkdir -p diagnostic-output && python tools/atlas-bus-data/tnds_capability_probe.py --output diagnostic-output/tnds-capability-probe.json
      - name: Record v2 legacy parity diagnostic deferred
        id: v2-diagnostic
        if: always() && inputs.prepared_schema == 'v2' && (inputs.measure_only == true || github.ref != 'refs/heads/main')
        run: |
          mkdir -p diagnostic-output
          echo 'Legacy v1 shadow parity is deferred: no exact same-window frozen NaPTAN CSV is available. No live NaPTAN fallback is permitted.' > diagnostic-output/legacy-parity-deferred.txt
      - name: Assemble compact v2 diagnostic artifact
        if: always() && inputs.prepared_schema == 'v2' && (inputs.measure_only == true || github.ref != 'refs/heads/main')
        run: |
          rm -rf diagnostic-artifact
          mkdir -p diagnostic-artifact
          cp -f diagnostic-output/* diagnostic-artifact/ 2>/dev/null || true
          cp -f pages-site/atlas/data/bus/manifest.json diagnostic-artifact/v2-bus-manifest.json 2>/dev/null || true
          cp -f pages-site/atlas/data/status/manifest.json diagnostic-artifact/v2-refresh-status.json 2>/dev/null || true
          cp -f pages-site/atlas/config/atlas-candidate-measurement.json diagnostic-artifact/atlas-candidate-measurement.json 2>/dev/null || true
          if find diagnostic-artifact -type f \( -name '*.xml' -o -name '*.csv' -o -name '*.zip' \) | grep -q .; then
            echo 'Raw authoritative source material must not enter the diagnostic artifact.'
            exit 1
          fi
      - name: Upload v2 national diagnostic artifact
        if: always() && inputs.prepared_schema == 'v2' && (inputs.measure_only == true || github.ref != 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v2-national-diagnostic-${{ github.run_id }}
          path: diagnostic-artifact
          if-no-files-found: warn
      - name: Fail v2 diagnostic after evidence collection when hard validation failed
        if: always() && inputs.prepared_schema == 'v2' && steps.candidate-validation.outcome == 'failure'
        run: |
          echo 'The v2 hard validator failed; aggregate evidence was collected and the candidate remains non-publishable.'
          exit 1
      - name: Enforce candidate publication capacity gates
        if: github.ref == 'refs/heads/main' && inputs.measure_only != true
        run: node tools/atlas-data-publication/candidate-checkpoint.mjs --capacity-only --candidate-site pages-site
      - name: Resolve validated candidate-generation timestamp
        id: candidate-timestamp
        if: github.ref == 'refs/heads/main' && inputs.measure_only != true
        run: echo "value=$(node tools/atlas-data-publication/candidate-checkpoint.mjs --timestamp-only --candidate-site pages-site)" >> "$GITHUB_OUTPUT"
      - name: Create verified candidate checkpoint
        if: github.ref == 'refs/heads/main' && inputs.measure_only != true && steps.checkpoint-restore.outputs.valid != 'true'
        run: node tools/atlas-data-publication/candidate-checkpoint.mjs --create --candidate-site pages-site --current-run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --current-commit-sha "${{ github.sha }}" --workflow-name "${{ github.workflow }}" --current-ref "${{ github.ref }}" --event-name "${{ github.event_name }}" --repository-root "$GITHUB_WORKSPACE" --cache-key "$ATLAS_CURRENT_CANDIDATE_CACHE_KEY" --gate-candidate-validation passed --gate-deterministic-checks passed --gate-capacity-measurement passed --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Save verified candidate checkpoint
        if: github.ref == 'refs/heads/main' && inputs.measure_only != true && steps.checkpoint-restore.outputs.valid != 'true' && (steps.candidate-cache.outputs.cache-hit != 'true' || inputs.resume_checkpoint_run_id != '')
        uses: actions/cache/save@v4
        with:
          path: |
            pages-site/atlas/data/bus
            pages-site/atlas/data/bus-tnds
            pages-site/atlas/data/status
            pages-site/atlas/config/atlas-candidate-measurement.json
            pages-site/.atlas-recovery/verified-candidate.json
          key: ${{ env.ATLAS_CURRENT_CANDIDATE_CACHE_KEY }}
      - name: Complete diagnostic-only run
        if: env.ATLAS_DIAGNOSTIC_ONLY == 'true'
        run: echo 'Fresh candidate measured; no publication repository, Pages site or production configuration was changed.'
      - name: Check out Bus reference-data publication repository
        if: github.ref == 'refs/heads/main' && inputs.measure_only != true
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ATLAS_BUS_DATA_REPOSITORY }}
          token: ${{ secrets.ATLAS_REFERENCE_DATA_TOKEN }}
          persist-credentials: false
          path: reference-data/bus
          ref: ${{ env.ATLAS_REFERENCE_DATA_BRANCH }}
      - name: Select and check out the inactive TNDS bank
        if: github.ref == 'refs/heads/main' && inputs.measure_only != true
        env:
          ATLAS_REFERENCE_DATA_TOKEN: ${{ secrets.ATLAS_REFERENCE_DATA_TOKEN }}
        run: |
          node tools/atlas-data-publication/select-bank.mjs --config last-known-good/atlas/config/atlas-data-sources.json --banks-json "$ATLAS_TNDS_BANKS_JSON" --output publication-config/bank-plan.json --repository-root reference-data/tnds
          node tools/atlas-data-publication/checkout-bank.mjs --plan publication-config/bank-plan.json --branch "$ATLAS_REFERENCE_DATA_BRANCH"
      - name: Prepare all bounded publications and candidate application configuration
        if: github.ref == 'refs/heads/main' && inputs.measure_only != true
        run: |
          ACTIVE_BUS_SLOT=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('last-known-good/active-publication.json','utf8'));process.stdout.write(x.bus.activeSlot||'')")
          node tools/atlas-data-publication/publication.mjs --candidate-site pages-site --bus-repository reference-data/bus --version "${{ github.run_id }}-${{ github.sha }}" --generated-at "${{ steps.candidate-timestamp.outputs.value }}" --bus-site-url "$ATLAS_BUS_DATA_SITE_URL" --active-bus-slot "$ACTIVE_BUS_SLOT" --tnds-bank-plan publication-config/bank-plan.json --config-output publication-config/atlas-data-sources.mjs
      - name: Publish Bus and every candidate TNDS root
        if: github.ref == 'refs/heads/main' && inputs.measure_only != true
        env:
          ATLAS_REFERENCE_DATA_TOKEN: ${{ secrets.ATLAS_REFERENCE_DATA_TOKEN }}
        run: node tools/atlas-data-publication/publish-bank.mjs --plan publication-config/bank-plan.json --branch "$ATLAS_REFERENCE_DATA_BRANCH"
      - name: Publish validated Bus bounded snapshot
        if: github.ref == 'refs/heads/main' && inputs.measure_only != true
        env:
          ATLAS_REFERENCE_DATA_TOKEN: ${{ secrets.ATLAS_REFERENCE_DATA_TOKEN }}
        run: node tools/atlas-data-publication/publish-snapshot.mjs --repository reference-data/bus --branch "$ATLAS_REFERENCE_DATA_BRANCH" --message "Publish ATLAS Bus snapshot ${{ github.run_id }}"
      - name: Wait for every candidate-bank root publication
        if: github.ref == 'refs/heads/main' && inputs.measure_only != true
        run: node tools/atlas-data-publication/wait-for-bank.mjs --config publication-config/atlas-data-sources.json
      - name: Validate every candidate root and exact cross-root allocation
        if: github.ref == 'refs/heads/main' && inputs.measure_only != true
        run: node tools/atlas-data-publication/validate-publication.mjs --config publication-config/atlas-data-sources.json
      - name: Install validated application data-source configuration
        if: github.ref == 'refs/heads/main' && inputs.measure_only != true
        run: |
          cp publication-config/atlas-data-sources.mjs pages-site/atlas/config/atlas-data-sources.mjs
          cp publication-config/atlas-data-sources.json pages-site/atlas/config/atlas-data-sources.json
          rm -rf pages-site/atlas/data/bus pages-site/atlas/data/bus-tnds
      - name: Validate complete application artifact
        run: |
          test -f pages-site/index.html
          test -f pages-site/atlas/index.html
          test -f pages-site/atlas/data/status/manifest.json
          if [ "$ATLAS_DIAGNOSTIC_ONLY" != "true" ]; then test -f pages-site/atlas/config/atlas-data-sources.mjs; test -f pages-site/atlas/config/atlas-data-sources.json; else test -f pages-site/atlas/config/atlas-candidate-measurement.json; fi
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && inputs.measure_only != true
        uses: actions/configure-pages@v5
      - name: Upload validated Pages artifact
        if: github.ref == 'refs/heads/main' && inputs.measure_only != true
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

  deploy:
    name: Deploy validated Pages artifact
    needs: [main-guard, freshness, build-validate]
    if: inputs.prepared_schema != 'v2' && needs.main-guard.outputs.trust_mode == '' && needs.freshness.outputs.refresh_required == 'true' && needs.build-validate.result == 'success' && github.ref == 'refs/heads/main' && inputs.measure_only != true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4

  freshness-no-op:
    name: Confirm already-fresh Bus data
    needs: [main-guard, freshness, build-validate]
    if: always() && inputs.prepared_schema != 'v2' && needs.main-guard.outputs.trust_mode == '' && needs.main-guard.result == 'success' && needs.freshness.outputs.refresh_required == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ needs.freshness.outputs.message }}"

  reference-source:
    name: Acquire or reuse exact v2 Bus source snapshot
    needs: main-guard
    if: inputs.prepared_schema == 'v2' && github.event_name == 'workflow_dispatch' && needs.main-guard.result == 'success' && needs.main-guard.outputs.trust_mode == '' && inputs.v2_expected_snapshot_id != 'TNDS-TRUST-DIAGNOSTIC-C1A' && inputs.v2_expected_snapshot_id != 'TNDS-TRUST-PREFLIGHT-C1B' && !startsWith(inputs.v2_expected_snapshot_id, 'TNDS-TRUST-')
    uses: ./.github/workflows/atlas-reference-data-source.yml
    with:
      v2_source_snapshot_run_id: ${{ inputs.v2_source_snapshot_run_id }}
      expected_snapshot_id: ${{ inputs.v2_source_snapshot_run_id != '' && inputs.v2_expected_snapshot_id || '' }}
      expected_source_count: ${{ inputs.v2_source_snapshot_run_id != '' && inputs.v2_expected_source_count || '' }}
      expected_total_bytes: ${{ inputs.v2_source_snapshot_run_id != '' && inputs.v2_expected_total_bytes || '' }}
    secrets: inherit
    permissions:
      actions: read
      contents: read

  reference-diagnostic:
    name: Prepare and diagnose v2 Bus data
    needs: [main-guard, reference-source]
    if: inputs.prepared_schema == 'v2' && needs.main-guard.result == 'success' && needs.main-guard.outputs.trust_mode == '' && needs.reference-source.result == 'success'
    uses: ./.github/workflows/atlas-reference-data-diagnostic.yml
    with:
      source_snapshot_artifact: ${{ needs.reference-source.outputs.snapshot_artifact }}
      source_snapshot_artifact_id: ${{ needs.reference-source.outputs.snapshot_artifact_id }}
      source_snapshot_run_id: ${{ needs.reference-source.outputs.producer_run_id }}
      producer_run_id: ${{ needs.reference-source.outputs.producer_run_id }}
      expected_snapshot_id: ${{ needs.reference-source.outputs.snapshot_id }}
      expected_source_count: ${{ needs.reference-source.outputs.source_count }}
      expected_total_bytes: ${{ needs.reference-source.outputs.total_bytes }}
    secrets: inherit
    permissions:
      actions: read
      contents: read

  tnds-trust-offline-preflight:
    name: Run offline TNDS TRUST C1B preflight
    needs: main-guard
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.prepared_schema == 'v2' && inputs.measure_only == true && inputs.force_refresh == true && inputs.resume_checkpoint_run_id == '' && inputs.v2_source_snapshot_run_id == '' && inputs.v2_expected_snapshot_id == 'TNDS-TRUST-PREFLIGHT-C1B' && inputs.v2_expected_source_count == '' && inputs.v2_expected_total_bytes == '' && needs.main-guard.result == 'success' && needs.main-guard.outputs.trust_mode == ''
    uses: ./.github/workflows/atlas-bus-tnds-trust-diagnostic.yml
    with:
      mode: offline_preflight
    permissions:
      actions: read
      contents: read

  tnds-trust-live-diagnostic:
    name: Run quarantined TNDS TRUST live diagnostic
    needs: main-guard
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.prepared_schema == 'v2' && inputs.measure_only == true && inputs.force_refresh == true && inputs.resume_checkpoint_run_id == '' && inputs.v2_expected_snapshot_id == 'TNDS-TRUST-DIAGNOSTIC-C1A' && inputs.v2_expected_source_count == '' && inputs.v2_expected_total_bytes == '' && needs.main-guard.result == 'success' && needs.main-guard.outputs.trust_mode == ''
    uses: ./.github/workflows/atlas-bus-tnds-trust-diagnostic.yml
    with:
      mode: live_trust
      prior_producer_run_id: ${{ inputs.v2_source_snapshot_run_id }}
    secrets:
      TNDS_USERNAME: ${{ secrets.TNDS_USERNAME }}
      TNDS_PASSWORD: ${{ secrets.TNDS_PASSWORD }}
    permissions:
      actions: read
      contents: read

  tnds-trust-browser-offline-preflight:
    name: Run default-branch-compatible TNDS TRUST offline preflight
    needs: main-guard
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-recoverable-reconciliation' || github.ref == 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-c1-region-scale-recovery-closeout' || github.ref == 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-c1-c1-c1-branch-dispatch-closeout' || github.ref == 'refs/heads/codex/atlas-bus-beta-s2a-refresh-checkpoint-readiness' || github.ref == 'refs/heads/codex/atlas-bus-beta-s2a-c1-review-candidate-composition') && needs.main-guard.result == 'success' && needs.main-guard.outputs.trust_mode == 'offline_preflight'
    uses: ./.github/workflows/atlas-bus-tnds-trust-diagnostic.yml
    with:
      mode: offline_preflight
    permissions:
      actions: read
      contents: read

  tnds-trust-browser-live:
    name: Run default-branch-compatible TNDS TRUST live diagnostic
    needs: main-guard
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-recoverable-reconciliation' || github.ref == 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-c1-region-scale-recovery-closeout' || github.ref == 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-c1-c1-c1-branch-dispatch-closeout') && needs.main-guard.result == 'success' && needs.main-guard.outputs.trust_mode == 'c3_live_trust'
    uses: ./.github/workflows/atlas-bus-tnds-trust-diagnostic.yml
    with:
      mode: live_trust
      prior_producer_run_id: ${{ needs.main-guard.outputs.trust_prior_producer_run_id }}
      expected_raw_artifact_id: '11903662011'
      expected_raw_artifact_digest: 'sha256:7783327324f160b1bb3dfbd156bede32c57ababc4c790864d6bf9efe175b6f8e'
    secrets:
      TNDS_USERNAME: ''
      TNDS_PASSWORD: ''
    permissions:
      actions: read
      contents: read

  c3-primary-source:
    name: Restore exact frozen Run #37 primary source
    needs: main-guard
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-recoverable-reconciliation' || github.ref == 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-c1-region-scale-recovery-closeout' || github.ref == 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-c1-c1-c1-branch-dispatch-closeout') && needs.main-guard.result == 'success' && needs.main-guard.outputs.trust_mode == 'c3_live_trust'
    uses: ./.github/workflows/atlas-reference-data-source.yml
    with:
      v2_source_snapshot_run_id: '38533475680'
      expected_snapshot_id: '13e2895be61c5bb5adaf8adec9896520b8224ff243766818d3ca920f0eae71e1'
      expected_source_count: '11'
      expected_total_bytes: ''
      expected_artifact_id: '11878857366'
      expected_artifact_digest: 'sha256:01018c145646fdf041ba0c91cbd91b842994f62a292815438a6866ed358db658'
    permissions:
      actions: read
      contents: read

  c3-primary-preparation:
    name: Prepare primary and upload verified reconciliation checkpoint
    needs: [main-guard, c3-primary-source]
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-recoverable-reconciliation' || github.ref == 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-c1-region-scale-recovery-closeout' || github.ref == 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-c1-c1-c1-branch-dispatch-closeout') && needs.main-guard.result == 'success' && needs.main-guard.outputs.trust_mode == 'c3_live_trust' && needs.c3-primary-source.result == 'success'
    uses: ./.github/workflows/atlas-reference-data-diagnostic.yml
    with:
      source_snapshot_artifact: ${{ needs.c3-primary-source.outputs.snapshot_artifact }}
      source_snapshot_artifact_id: ${{ needs.c3-primary-source.outputs.snapshot_artifact_id }}
      source_snapshot_run_id: ${{ needs.c3-primary-source.outputs.producer_run_id }}
      producer_run_id: ${{ needs.c3-primary-source.outputs.producer_run_id }}
      expected_snapshot_id: ${{ needs.c3-primary-source.outputs.snapshot_id }}
      expected_source_count: ${{ needs.c3-primary-source.outputs.source_count }}
      expected_total_bytes: ${{ needs.c3-primary-source.outputs.total_bytes }}
    permissions:
      actions: read
      contents: read

  c3-live-reconciliation:
    name: Reconcile from this run's two verified checkpoints
    needs: [main-guard, tnds-trust-browser-live, c3-primary-preparation]
    if: always() && github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-recoverable-reconciliation' || github.ref == 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-c1-region-scale-recovery-closeout' || github.ref == 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-c1-c1-c1-branch-dispatch-closeout') && needs.main-guard.result == 'success' && needs.main-guard.outputs.trust_mode == 'c3_live_trust' && needs.tnds-trust-browser-live.result == 'success' && needs.c3-primary-preparation.result == 'success'
    uses: ./.github/workflows/atlas-bus-data-c3-reconcile.yml
    with:
      checkpoint_run_id: ${{ github.run_id }}
    permissions:
      actions: read
      contents: read

  c3-checkpoint-retry:
    name: Verify and reconcile restored C3 checkpoints without national preparation
    needs: main-guard
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-recoverable-reconciliation' || github.ref == 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-c1-region-scale-recovery-closeout' || github.ref == 'refs/heads/codex/atlas-bus-data-trust-1a-c1b-c3-c1-c1-c1-branch-dispatch-closeout' || github.ref == 'refs/heads/codex/atlas-bus-data-trust-r45-c1-reconciliation-contract-closeout') && needs.main-guard.result == 'success' && needs.main-guard.outputs.trust_mode == 'c3_checkpoint_retry'
    uses: ./.github/workflows/atlas-bus-data-c3-reconcile.yml
    with:
      checkpoint_run_id: ${{ needs.main-guard.outputs.trust_prior_producer_run_id }}
    permissions:
      actions: read
      contents: read

  s2a-c1-review-candidate:
    name: Compose or restore isolated S2A-C1 review candidate
    needs: main-guard
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/atlas-bus-beta-s2a-c1-review-candidate-composition' && needs.main-guard.result == 'success' && needs.main-guard.outputs.trust_mode == 'review_candidate' && needs.main-guard.outputs.review_candidate_mode != ''
    uses: ./.github/workflows/atlas-bus-beta-candidate.yml
    with:
      mode: ${{ needs.main-guard.outputs.review_candidate_mode }}
      primary_source_run_id: ${{ inputs.primary_source_run_id }}
      primary_artifact_id: ${{ inputs.primary_artifact_id }}
      primary_artifact_digest: ${{ inputs.primary_artifact_digest }}
      tnds_source_run_id: ${{ inputs.tnds_source_run_id }}
      tnds_artifact_id: ${{ inputs.tnds_artifact_id }}
      tnds_artifact_digest: ${{ inputs.tnds_artifact_digest }}
      candidate_checkpoint_run_id: ${{ inputs.candidate_checkpoint_run_id }}
      candidate_artifact_id: ${{ inputs.candidate_artifact_id }}
      candidate_artifact_digest: ${{ inputs.candidate_artifact_digest }}
    secrets:
      TNDS_USERNAME: ${{ secrets.TNDS_USERNAME }}
      TNDS_PASSWORD: ${{ secrets.TNDS_PASSWORD }}
    permissions:
      actions: read
      contents: read
