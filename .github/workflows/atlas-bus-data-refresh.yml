name: ATLAS Bus data refresh

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Bypass the weekly freshness guard and run the complete validated refresh.'
        required: false
        default: false
        type: boolean
  schedule:
    # Temporary Alpha.14 unattended canary for Monday 2026-09-14.
    - cron: '37 5 * * 1'
    - cron: '17 6 * * 5'
    - cron: '47 7 * * 5'
    - cron: '23 12 * * 5'

permissions:
  contents: read

env:
  ATLAS_BUS_DATA_REPOSITORY: ${{ vars.ATLAS_BUS_DATA_REPOSITORY }}
  ATLAS_TNDS_DATA_REPOSITORY: ${{ vars.ATLAS_TNDS_DATA_REPOSITORY }}
  ATLAS_BUS_DATA_SITE_URL: ${{ vars.ATLAS_BUS_DATA_SITE_URL }}
  ATLAS_TNDS_DATA_SITE_URL: ${{ vars.ATLAS_TNDS_DATA_SITE_URL }}
  ATLAS_REFERENCE_DATA_BRANCH: ${{ vars.ATLAS_REFERENCE_DATA_BRANCH || 'main' }}

concurrency:
  group: atlas-bus-pages
  cancel-in-progress: false

jobs:
  main-guard:
    name: Require production main ref
    runs-on: ubuntu-latest
    steps:
      - name: Refuse non-main refresh
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::ATLAS Bus refresh is permitted only from refs/heads/main; refusing to build or deploy $GITHUB_REF."
          exit 1

  freshness:
    name: Check weekly Bus refresh freshness
    needs: main-guard
    runs-on: ubuntu-latest
    outputs:
      refresh_required: ${{ steps.decision.outputs.refresh_required }}
      reason: ${{ steps.decision.outputs.reason }}
      message: ${{ steps.decision.outputs.message }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Obtain deployed Bus and status manifests
        shell: bash
        run: |
          rm -rf last-known-good
          node tools/atlas-data-publication/fetch-last-known-good.mjs 'https://joerfreeman02.github.io/transport-planner-toolkit/atlas/' last-known-good
      - name: Decide whether a full refresh is required
        id: decision
        env:
          FORCE_REFRESH: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_refresh) || (github.event_name == 'schedule' && github.event.schedule == '37 5 * * 1') }}
        shell: bash
        run: |
          node tools/atlas-bus-data/refresh-freshness.mjs \
            --status last-known-good/atlas/data/status/manifest.json \
            --bus last-known-good/atlas/data/bus/manifest.json \
            --tnds last-known-good/atlas/data/bus-tnds/manifest.json \
            --force-refresh "$FORCE_REFRESH" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Record freshness decision
        run: echo "${{ steps.decision.outputs.message }}"

  build-validate:
    name: Build and validate Bus candidate
    needs: [main-guard, freshness]
    if: needs.freshness.outputs.refresh_required == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Prepare isolated Pages site
        shell: bash
        run: |
          rm -rf pages-site
          mkdir pages-site
          rsync -a --exclude='.git' --exclude='pages-site' --exclude='atlas/data/bus' --exclude='atlas/data/bus-tnds' ./ pages-site/
      - name: Require reference-data publication targets
        shell: bash
        run: |
          test -n "$ATLAS_BUS_DATA_REPOSITORY"
          test -n "$ATLAS_TNDS_DATA_REPOSITORY"
          test -n "$ATLAS_BUS_DATA_SITE_URL"
          test -n "$ATLAS_TNDS_DATA_SITE_URL"
          test -n "${{ secrets.ATLAS_REFERENCE_DATA_TOKEN }}"
      - name: Obtain last-known-good deployed metadata
        shell: bash
        run: |
          rm -rf last-known-good
          node tools/atlas-data-publication/fetch-last-known-good.mjs 'https://joerfreeman02.github.io/transport-planner-toolkit/atlas/' last-known-good
      - name: Acquire and build validated Bus candidate
        env:
          TNDS_USERNAME: ${{ secrets.TNDS_USERNAME }}
          TNDS_PASSWORD: ${{ secrets.TNDS_PASSWORD }}
          ATLAS_NODE: node
        run: python tools/atlas-bus-data/refresh_bus_data.py --site-root pages-site --previous-root last-known-good
      - name: Validate generated candidate data
        run: python tools/atlas-bus-data/validate_candidate.py --site-root pages-site
      - name: Run deterministic ATLAS checks
        run: node tests/atlas/run-all.mjs
      - name: Check out Bus reference-data publication repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ATLAS_BUS_DATA_REPOSITORY }}
          token: ${{ secrets.ATLAS_REFERENCE_DATA_TOKEN }}
          path: reference-data/bus-repository
          ref: ${{ env.ATLAS_REFERENCE_DATA_BRANCH }}
      - name: Check out TNDS reference-data publication repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ATLAS_TNDS_DATA_REPOSITORY }}
          token: ${{ secrets.ATLAS_REFERENCE_DATA_TOKEN }}
          path: reference-data/tnds-repository
          ref: ${{ env.ATLAS_REFERENCE_DATA_BRANCH }}
      - name: Prepare and size-gate versioned reference-data publications
        id: publications
        shell: bash
        env:
          PUBLICATION_VERSION: ${{ github.run_id }}-${{ github.sha }}
          GENERATED_AT: ${{ github.run_started_at }}
        run: |
          node tools/atlas-data-publication/publication.mjs \
            --candidate-site pages-site \
            --bus-destination "reference-data/bus-repository/releases/$PUBLICATION_VERSION" \
            --tnds-destination "reference-data/tnds-repository/releases/$PUBLICATION_VERSION" \
            --version "$PUBLICATION_VERSION" \
            --generated-at "$GENERATED_AT" \
            --bus-base-url "$ATLAS_BUS_DATA_SITE_URL/releases/$PUBLICATION_VERSION/" \
            --tnds-base-url "$ATLAS_TNDS_DATA_SITE_URL/releases/$PUBLICATION_VERSION/" \
            --config-output pages-site/atlas/config/atlas-data-sources.mjs
      - name: Publish validated Bus reference-data version
        shell: bash
        run: |
          git -C reference-data/bus-repository config user.name 'github-actions[bot]'
          git -C reference-data/bus-repository config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C reference-data/bus-repository add "releases/${{ github.run_id }}-${{ github.sha }}"
          git -C reference-data/bus-repository commit -m "Publish ATLAS Bus reference data ${{ github.run_id }}" || test $? -eq 1
          git -C reference-data/bus-repository push origin "HEAD:$ATLAS_REFERENCE_DATA_BRANCH"
      - name: Publish validated TNDS reference-data version
        shell: bash
        run: |
          git -C reference-data/tnds-repository config user.name 'github-actions[bot]'
          git -C reference-data/tnds-repository config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C reference-data/tnds-repository add "releases/${{ github.run_id }}-${{ github.sha }}"
          git -C reference-data/tnds-repository commit -m "Publish ATLAS TNDS reference data ${{ github.run_id }}" || test $? -eq 1
          git -C reference-data/tnds-repository push origin "HEAD:$ATLAS_REFERENCE_DATA_BRANCH"
      - name: Wait for both immutable Pages publications
        shell: bash
        run: |
          node tools/atlas-data-publication/wait-for-publication.mjs \
            "$ATLAS_BUS_DATA_SITE_URL/releases/${{ github.run_id }}-${{ github.sha }}/manifest.json" \
            "$ATLAS_BUS_DATA_SITE_URL/releases/${{ github.run_id }}-${{ github.sha }}/publication-manifest.json" \
            "$ATLAS_TNDS_DATA_SITE_URL/releases/${{ github.run_id }}-${{ github.sha }}/manifest.json" \
            "$ATLAS_TNDS_DATA_SITE_URL/releases/${{ github.run_id }}-${{ github.sha }}/publication-manifest.json"
      - name: Remove reference data from the application Pages payload
        shell: bash
        run: rm -rf pages-site/atlas/data/bus pages-site/atlas/data/bus-tnds
      - name: Validate complete legacy and ATLAS artifact
        shell: bash
        run: |
          test -f pages-site/index.html
          test -f pages-site/atlas/index.html
          test -f pages-site/atlas/data/status/manifest.json
          test -f pages-site/atlas/config/atlas-data-sources.mjs
          test -f pages-site/atlas/config/atlas-data-sources.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

  deploy:
    name: Deploy validated Pages artifact
    needs: [main-guard, freshness, build-validate]
    if: needs.freshness.outputs.refresh_required == 'true' && needs.build-validate.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  freshness-no-op:
    name: Confirm already-fresh Bus data
    needs: [main-guard, freshness, build-validate]
    if: always() && needs.main-guard.result == 'success' && needs.freshness.outputs.refresh_required == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Complete without a duplicate refresh
        run: echo "${{ needs.freshness.outputs.message }}"
