name: ATLAS reference data prepare and diagnostic

on:
  workflow_call:
    inputs:
      source_snapshot_artifact:
        description: Exact verified source snapshot artifact name
        required: true
        type: string
      source_snapshot_run_id:
        description: Workflow run that produced the exact source snapshot artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  prepare-diagnose:
    name: Prepare from explicit source snapshot and diagnose
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Restore supplied source snapshot from exact producer run
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_snapshot_artifact }}
          run-id: ${{ inputs.source_snapshot_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: source-input
      - name: Verify snapshot before interpretation
        run: |
          python tools/atlas-bus-data/source_snapshot.py --verify source-input/source-snapshot > source-input/verified-manifest.json
          cp source-input/source-snapshot/manifest.json source-input/verified-snapshot-manifest.json
      - name: Restore last-known-good diagnostic comparison state
        run: node tools/atlas-data-publication/fetch-last-known-good.mjs 'https://joerfreeman02.github.io/transport-planner-toolkit/atlas/' last-known-good
      - name: Prepare Bus v2 with acquisition disabled
        run: |
          mkdir -p pages-site
          python tools/atlas-bus-data/refresh_bus_data.py --site-root pages-site --prepared-schema v2 --bus-only-diagnostic --source-snapshot source-input/source-snapshot --acquisition-disabled
      - name: Run aggregate structural scan
        id: structural-scan
        if: always()
        continue-on-error: true
        run: |
          mkdir -p diagnostic-output
          python tools/atlas-bus-data/structural_scan.py --site-root pages-site --output diagnostic-output/structural-scan.json
      - name: Run hard candidate validation (fail closed)
        id: hard-validator
        if: always()
        continue-on-error: true
        run: python tools/atlas-bus-data/validate_candidate.py --site-root pages-site --bus-only
      - name: Run deterministic ATLAS checks
        id: deterministic-tests
        if: always()
        continue-on-error: true
        run: node tests/atlas/run-all.mjs > diagnostic-output/deterministic-tests.log 2>&1
      - name: Probe TNDS metadata without archive transfer
        id: tnds-probe
        if: always()
        continue-on-error: true
        env:
          TNDS_USERNAME: ${{ secrets.TNDS_USERNAME }}
          TNDS_PASSWORD: ${{ secrets.TNDS_PASSWORD }}
        run: python tools/atlas-bus-data/tnds_capability_probe.py --output diagnostic-output/tnds-capability-probe.json
      - name: Run same-source-window parity and capacity diagnostics
        id: national-diagnostic
        if: always()
        continue-on-error: true
        run: |
          CANDIDATE_FINGERPRINT=$(node --input-type=module -e "import { computeCandidateGenerationCompatibilityFingerprint } from './tools/atlas-data-publication/candidate-compatibility.mjs'; console.log((await computeCandidateGenerationCompatibilityFingerprint({ rootDir: process.cwd() })).sha256)")
          python tools/atlas-bus-data/national_v2_diagnostic.py --candidate-site pages-site --previous-root last-known-good --report-dir diagnostic-output --candidate-fingerprint "$CANDIDATE_FINGERPRINT" --same-window-bods-dir source-input/source-snapshot/sources/bods --structural-report diagnostic-output/structural-scan.json
      - name: Measure diagnostic candidate capacity
        id: capacity
        if: always()
        continue-on-error: true
        run: mkdir -p pages-site/atlas/config && node tools/atlas-data-publication/measure-candidate.mjs --candidate-site pages-site --output pages-site/atlas/config/atlas-candidate-measurement.json --bus-only
      - name: Upload evidence-safe diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-reference-diagnostic-${{ github.run_id }}
          path: |
            diagnostic-output
            source-input/verified-snapshot-manifest.json
            pages-site/atlas/data/bus/manifest.json
            pages-site/atlas/data/status/manifest.json
            pages-site/atlas/config/atlas-candidate-measurement.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve fail-closed conclusions
        if: steps.hard-validator.outcome == 'failure' || steps.structural-scan.outcome == 'failure' || steps.deterministic-tests.outcome == 'failure' || steps.tnds-probe.outcome == 'failure' || steps.national-diagnostic.outcome == 'failure' || steps.capacity.outcome == 'failure'
        run: |
          echo 'A required diagnostic conclusion failed; evidence was uploaded and this run remains non-publishable.'
          exit 1
