name: ATLAS reference data prepare and diagnostic

on:
  workflow_call:
    inputs:
      source_snapshot_artifact:
        description: Exact verified source snapshot artifact name
        required: true
        type: string
      source_snapshot_run_id:
        description: Workflow run that produced the exact source snapshot artifact
        required: true
        type: string
      source_snapshot_artifact_id:
        description: Immutable GitHub artifact ID returned by the source producer
        required: true
        type: string
      producer_run_id:
        description: Run that produced the exact source snapshot artifact
        required: true
        type: string
      expected_snapshot_id:
        description: Exact expected immutable source snapshot ID
        required: true
        type: string
      expected_source_count:
        description: Exact expected source count
        required: true
        type: string
      expected_total_bytes:
        description: Exact expected total source bytes
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  prepare-diagnose:
    name: Prepare from explicit source snapshot and diagnose
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Require a pristine Git checkout for deterministic ATLAS checks
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo '::error::The deterministic ATLAS suite requires a clean Git checkout before diagnostic workspaces are created.'
            git status --short
            exit 1
          fi
      - name: Run deterministic ATLAS checks from pristine checkout
        id: deterministic-tests
        continue-on-error: true
        run: node tests/atlas/run-all.mjs > "$RUNNER_TEMP/atlas-deterministic-tests.log" 2>&1
      - name: Verify exact producer artifact identity
        id: verify-producer-artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_snapshot_artifact_id }}
          SOURCE_ARTIFACT_NAME: ${{ inputs.source_snapshot_artifact }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" > "$RUNNER_TEMP/source-artifact.json"
          python - "$RUNNER_TEMP/source-artifact.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          artifact = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          checks = {
              'id': int(os.environ['SOURCE_ARTIFACT_ID']),
              'name': os.environ['SOURCE_ARTIFACT_NAME'],
              'expired': False,
              'workflow_run': {'id': int(os.environ['PRODUCER_RUN_ID'])},
          }
          for key, expected in checks.items():
              actual = artifact.get(key)
              if isinstance(expected, dict):
                  actual = actual or {}
                  for nested_key, nested_expected in expected.items():
                      if actual.get(nested_key) != nested_expected:
                          raise SystemExit(f'Producer artifact {key}.{nested_key} mismatch: expected {nested_expected}, received {actual.get(nested_key)}')
              elif actual != expected:
                  raise SystemExit(f'Producer artifact {key} mismatch: expected {expected}, received {actual}')
          print('Exact producer artifact ID, name, run, and availability verified.')
          PY
      - name: Restore supplied source snapshot from exact producer run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.source_snapshot_artifact_id }}
          run-id: ${{ inputs.source_snapshot_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: source-input
          merge-multiple: true
      - name: Verify snapshot before interpretation
        id: verify-snapshot
        env:
          EXPECTED_SNAPSHOT_ID: ${{ inputs.expected_snapshot_id }}
          EXPECTED_SOURCE_COUNT: ${{ inputs.expected_source_count }}
          EXPECTED_TOTAL_BYTES: ${{ inputs.expected_total_bytes }}
        run: |
          test -f source-input/source-snapshot/manifest.json
          python tools/atlas-bus-data/source_snapshot.py --verify source-input/source-snapshot \
            --expected-snapshot-id "$EXPECTED_SNAPSHOT_ID" \
            --expected-source-count "$EXPECTED_SOURCE_COUNT" \
            --expected-total-bytes "$EXPECTED_TOTAL_BYTES" > source-input/verified-manifest.json
          cp source-input/source-snapshot/manifest.json source-input/verified-snapshot-manifest.json
      - name: Restore last-known-good diagnostic comparison state
        id: restore-last-known-good
        run: node tools/atlas-data-publication/fetch-last-known-good.mjs 'https://joerfreeman02.github.io/transport-planner-toolkit/atlas/' last-known-good
      - name: Stage and verify diagnostic release metadata
        id: release-metadata
        run: |
          rm -rf pages-site
          mkdir -p pages-site/atlas/config
          cp atlas/config/atlas-release.json pages-site/atlas/config/atlas-release.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('pages-site/atlas/config/atlas-release.json')
          try:
              metadata = json.loads(path.read_text(encoding='utf-8'))
          except (OSError, json.JSONDecodeError) as error:
              raise SystemExit(f'Release metadata preflight failed: {path}') from error
          if not str(metadata.get('version', '')).strip() or not str(metadata.get('build', '')).strip():
              raise SystemExit(f'Release metadata preflight failed: version/build must be non-empty: {path}')
          print(f'Release metadata preflight passed: {path}')
          PY
      - name: Prepare Bus v2 with acquisition disabled
        id: prepare-v2
        if: always() && steps.verify-producer-artifact.outcome == 'success' && steps.verify-snapshot.outcome == 'success' && steps.restore-last-known-good.outcome == 'success' && steps.release-metadata.outcome == 'success'
        run: |
          python tools/atlas-bus-data/refresh_bus_data.py --site-root pages-site --previous-root last-known-good --prepared-schema v2 --bus-only-diagnostic --source-snapshot source-input/source-snapshot --acquisition-disabled
      - name: Verify prepared candidate handoff
        id: prepared-output-handoff
        if: always() && steps.prepare-v2.outcome == 'success'
        run: python tools/atlas-bus-data/verify_prepared_handoff.py --site-root pages-site --expected-snapshot-id "${{ inputs.expected_snapshot_id }}"
      - name: Run national coverage ledger gate
        id: coverage-gate
        if: always() && steps.prepare-v2.outcome == 'success' && steps.prepared-output-handoff.outcome == 'success'
        continue-on-error: true
        run: python tools/atlas-bus-data/coverage_ledger.py --gate pages-site/diagnostic-output/coverage-ledger.json
      - name: Run aggregate structural scan
        id: structural-scan
        if: always() && steps.prepare-v2.outcome == 'success' && steps.prepared-output-handoff.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p diagnostic-output
          python tools/atlas-bus-data/structural_scan.py --site-root pages-site --output diagnostic-output/structural-scan.json
      - name: Run hard candidate validation (fail closed)
        id: hard-validator
        if: always() && steps.prepare-v2.outcome == 'success' && steps.prepared-output-handoff.outcome == 'success'
        continue-on-error: true
        run: python tools/atlas-bus-data/validate_candidate.py --site-root pages-site --bus-only
      - name: Probe TNDS metadata without archive transfer
        id: tnds-probe
        if: always()
        continue-on-error: true
        env:
          TNDS_USERNAME: ${{ secrets.TNDS_USERNAME }}
          TNDS_PASSWORD: ${{ secrets.TNDS_PASSWORD }}
        run: python tools/atlas-bus-data/tnds_capability_probe.py --output diagnostic-output/tnds-capability-probe.json
      - name: Measure diagnostic candidate capacity
        id: capacity
        if: always() && steps.prepare-v2.outcome == 'success' && steps.prepared-output-handoff.outcome == 'success'
        continue-on-error: true
        run: mkdir -p pages-site/atlas/config && node tools/atlas-data-publication/measure-candidate.mjs --candidate-site pages-site --output pages-site/atlas/config/atlas-candidate-measurement.json --bus-only
      - name: Copy deterministic test log into evidence workspace
        if: always()
        run: |
          mkdir -p diagnostic-output
          if [ -f "$RUNNER_TEMP/atlas-deterministic-tests.log" ]; then
            cp "$RUNNER_TEMP/atlas-deterministic-tests.log" diagnostic-output/deterministic-tests.log
          else
            echo 'Deterministic test log was not produced because the pristine-checkout gate failed.' > diagnostic-output/deterministic-tests.log
          fi
      - name: Upload evidence-safe diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-reference-diagnostic-${{ github.run_id }}
          path: |
            diagnostic-output
            pages-site/diagnostic-output
            source-input/verified-snapshot-manifest.json
            pages-site/atlas/data/bus/manifest.json
            pages-site/atlas/data/status/manifest.json
            pages-site/atlas/config/atlas-candidate-measurement.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve fail-closed conclusions
        if: always() && (steps.verify-snapshot.outcome != 'success' || steps.release-metadata.outcome != 'success' || steps.prepare-v2.outcome != 'success' || steps.prepared-output-handoff.outcome != 'success' || steps.coverage-gate.outcome != 'success' || steps.structural-scan.outcome != 'success' || steps.hard-validator.outcome != 'success' || steps.deterministic-tests.outcome != 'success' || steps.tnds-probe.outcome != 'success' || steps.capacity.outcome != 'success')
        run: |
          echo 'A required diagnostic conclusion failed, including preparation or a downstream gate; evidence was uploaded and this run remains non-publishable.'
          exit 1
