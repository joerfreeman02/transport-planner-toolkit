name: ATLAS reference data source

on:
  workflow_call:
    inputs:
      v2_source_snapshot_run_id:
        description: Exact prior source workflow run ID for frozen diagnostic reuse
        required: false
        default: ''
        type: string
      expected_snapshot_id:
        description: Optional snapshot ID to require when explicitly reusing a frozen snapshot
        required: false
        default: ''
        type: string
      expected_source_count:
        description: Optional source count to require when explicitly reusing a frozen snapshot
        required: false
        default: ''
        type: string
      expected_total_bytes:
        description: Optional total byte count to require when explicitly reusing a frozen snapshot
        required: false
        default: ''
        type: string
      expected_artifact_id:
        description: Optional immutable source artifact ID to require for frozen reuse
        required: false
        default: ''
        type: string
      expected_artifact_digest:
        description: Optional source artifact digest to require for frozen reuse
        required: false
        default: ''
        type: string
    outputs:
      snapshot_artifact:
        description: Name of the verified source snapshot artifact
        value: ${{ jobs.acquire.outputs.snapshot_artifact }}
      snapshot_artifact_id:
        description: ID of the verified source snapshot artifact
        value: ${{ jobs.acquire.outputs.snapshot_artifact_id }}
      snapshot_id:
        description: Snapshot ID read from the verified source manifest
        value: ${{ jobs.acquire.outputs.snapshot_id }}
      source_count:
        description: Source count read from the verified source manifest
        value: ${{ jobs.acquire.outputs.source_count }}
      total_bytes:
        description: Total source bytes read from the verified source manifest
        value: ${{ jobs.acquire.outputs.total_bytes }}
      producer_run_id:
        description: Run that produced the verified immutable artifact
        value: ${{ jobs.acquire.outputs.producer_run_id }}

permissions:
  actions: read
  contents: read

jobs:
  acquire:
    name: Inspect freshness and acquire Bus source snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      snapshot_artifact: ${{ steps.snapshot-name.outputs.name }}
      snapshot_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      snapshot_id: ${{ steps.verify.outputs.snapshot_id }}
      source_count: ${{ steps.verify.outputs.source_count }}
      total_bytes: ${{ steps.verify.outputs.total_bytes }}
      producer_run_id: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify exact frozen-source artifact ID and digest
        if: inputs.v2_source_snapshot_run_id != '' && inputs.expected_artifact_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_ARTIFACT_ID: ${{ inputs.expected_artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ inputs.expected_artifact_digest }}
          EXPECTED_PRODUCER_RUN_ID: ${{ inputs.v2_source_snapshot_run_id }}
          EXPECTED_ARTIFACT_NAME: atlas-reference-source-snapshot-${{ inputs.v2_source_snapshot_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT_ID" > "$RUNNER_TEMP/expected-source-artifact.json"
          python - "$RUNNER_TEMP/expected-source-artifact.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          artifact = json.loads(Path(sys.argv[1]).read_text())
          expected = {'id': int(os.environ['EXPECTED_ARTIFACT_ID']), 'name': os.environ['EXPECTED_ARTIFACT_NAME'],
                      'digest': os.environ['EXPECTED_ARTIFACT_DIGEST'], 'expired': False,
                      'workflow_run': {'id': int(os.environ['EXPECTED_PRODUCER_RUN_ID'])}}
          for key, value in expected.items():
              actual = artifact.get(key)
              if isinstance(value, dict):
                  actual = actual or {}
                  for nested, nested_value in value.items():
                      if actual.get(nested) != nested_value: raise SystemExit(f'Frozen source artifact {key}.{nested} mismatch')
              elif actual != value: raise SystemExit(f'Frozen source artifact {key} mismatch')
          PY
      - name: Probe remote metadata without source transfer
        if: inputs.v2_source_snapshot_run_id == ''
        run: |
          mkdir -p source-probe
          python tools/atlas-bus-data/source_freshness.py --output source-probe/freshness.json
      - name: Restore exact prior snapshot for explicit frozen diagnostic reuse
        if: inputs.v2_source_snapshot_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: atlas-reference-source-snapshot-${{ inputs.v2_source_snapshot_run_id }}
          run-id: ${{ inputs.v2_source_snapshot_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: prior-source
      - name: Assert restored frozen snapshot manifest
        if: inputs.v2_source_snapshot_run_id != ''
        run: test -f prior-source/source-snapshot/manifest.json
      - name: Reuse exact verified snapshot without claiming current freshness
        if: inputs.v2_source_snapshot_run_id != ''
        run: python tools/atlas-bus-data/source_snapshot.py --mark-frozen-reuse prior-source/source-snapshot --source-run-id "${{ inputs.v2_source_snapshot_run_id }}" --output source-snapshot
      - name: Bind exact original source artifact metadata into reuse manifest
        if: inputs.v2_source_snapshot_run_id != '' && inputs.expected_artifact_id != ''
        env:
          EXPECTED_ARTIFACT_ID: ${{ inputs.expected_artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ inputs.expected_artifact_digest }}
          EXPECTED_PRODUCER_RUN_ID: ${{ inputs.v2_source_snapshot_run_id }}
          EXPECTED_ARTIFACT_NAME: atlas-reference-source-snapshot-${{ inputs.v2_source_snapshot_run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('source-snapshot/manifest.json')
          manifest = json.loads(path.read_text())
          manifest['frozenReuseArtifact'] = {'id': os.environ['EXPECTED_ARTIFACT_ID'], 'name': os.environ['EXPECTED_ARTIFACT_NAME'],
              'digest': os.environ['EXPECTED_ARTIFACT_DIGEST'], 'producerRunId': os.environ['EXPECTED_PRODUCER_RUN_ID']}
          path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
      - name: Assert frozen reuse output manifest
        if: inputs.v2_source_snapshot_run_id != ''
        run: test -f source-snapshot/manifest.json
      - name: Acquire the authorised Bus source set once
        if: inputs.v2_source_snapshot_run_id == ''
        run: python tools/atlas-bus-data/source_snapshot.py --acquire --output source-snapshot
      - name: Verify source snapshot provenance and hashes
        id: verify
        env:
          EXPECTED_SNAPSHOT_ID: ${{ inputs.expected_snapshot_id }}
          EXPECTED_SOURCE_COUNT: ${{ inputs.expected_source_count }}
          EXPECTED_TOTAL_BYTES: ${{ inputs.expected_total_bytes }}
        run: |
          verify_args=(--verify source-snapshot)
          [[ -z "$EXPECTED_SNAPSHOT_ID" ]] || verify_args+=(--expected-snapshot-id "$EXPECTED_SNAPSHOT_ID")
          [[ -z "$EXPECTED_SOURCE_COUNT" ]] || verify_args+=(--expected-source-count "$EXPECTED_SOURCE_COUNT")
          [[ -z "$EXPECTED_TOTAL_BYTES" ]] || verify_args+=(--expected-total-bytes "$EXPECTED_TOTAL_BYTES")
          python tools/atlas-bus-data/source_snapshot.py "${verify_args[@]}" > "$RUNNER_TEMP/verified-source-manifest.json"
          python - "$RUNNER_TEMP/verified-source-manifest.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          sources = manifest['sources']
          values = {
              'snapshot_id': manifest['snapshotId'],
              'source_count': len(sources),
              'total_bytes': sum(int(source['bytes']) for source in sources),
          }
          with Path(sys.argv[2]).open('a', encoding='utf-8') as output:
              for key, value in values.items():
                  output.write(f'{key}={value}\n')
          PY
      - name: Record verified snapshot mode evidence
        id: snapshot-mode-evidence
        env:
          FROZEN_SOURCE_RUN_ID: ${{ inputs.v2_source_snapshot_run_id }}
          VERIFIED_SNAPSHOT_ID: ${{ steps.verify.outputs.snapshot_id }}
          VERIFIED_SOURCE_COUNT: ${{ steps.verify.outputs.source_count }}
          VERIFIED_TOTAL_BYTES: ${{ steps.verify.outputs.total_bytes }}
        run: |
          mkdir -p source-probe/evidence
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          frozen_run_id = os.environ['FROZEN_SOURCE_RUN_ID']
          frozen = bool(frozen_run_id)
          evidence = {
              'schema': 'atlas-source-snapshot-mode-evidence-v1',
              'mode': 'explicit frozen reuse' if frozen else 'fresh acquisition',
              'originalSourceRunId': frozen_run_id or None,
              'currentSourceFreshnessClaimed': not frozen,
              'snapshotId': os.environ['VERIFIED_SNAPSHOT_ID'],
              'sourceCount': int(os.environ['VERIFIED_SOURCE_COUNT']),
              'totalBytes': int(os.environ['VERIFIED_TOTAL_BYTES']),
          }
          Path('source-probe/evidence/source-snapshot-mode.json').write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Record exact snapshot artifact name
        id: snapshot-name
        run: echo "name=atlas-reference-source-snapshot-${GITHUB_RUN_ID}" >> "${GITHUB_OUTPUT}"
      - name: Upload immutable source snapshot for preparation reuse
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.snapshot-name.outputs.name }}
          path: |
            source-snapshot
            source-probe
          if-no-files-found: error
          overwrite: false
          retention-days: 14
